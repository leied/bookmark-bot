name: Deploy

on:
  push:
    branches: [typescript]
  workflow_dispatch:

# The default token needs nothing beyond reading this repo's code.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs rather than mutable tags, so a
      # compromised or retagged release cannot reach CLOUDFLARE_API_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Deploys with the lockfile-pinned wrangler instead of a third-party
      # action, so the only code that sees the token is this repo's own
      # dependencies. Requires a CLOUDFLARE_API_TOKEN repository secret with
      # the "Edit Cloudflare Workers" permission, scoped to this Worker.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
